<!DOCTYPE html>
<html lang="pt-BR">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scanner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scanner">

        <section class="painel">

            <div class="campo-nome">
                <label for="nome">Coloque seu nome completo:</label>
                <input
                    type="text"
                    id="nome"
                >
            </div>

            <button id="botaoScannear">
                Scannear
            </button>

            <div id="frase" class="frase"></div>

            <h2>Rank Global</h2>

            <div id="tabelaRank" class="tabela-rank">
                <ul>
                    
                </ul>
            </div>

        </section>

        <section class="imagem-container">
            <img
                id="imagemScanner"
                src="Scanner.png"
                alt="Scanner"
            >
        </section>

    </main>

</body>
</html>
